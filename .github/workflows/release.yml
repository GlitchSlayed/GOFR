name: GOFR Workstation Release Pipeline

on:
  workflow_dispatch:
    inputs:
      fedora_release:
        description: 'Target Fedora Release Version'
        required: true
        default: '45'
      release_version:
        description: 'Specific release version/tag (leave empty for auto-incremental, e.g. 45.1, 45.2)'
        required: false
        default: ''
      esp_size_mib:
        description: 'EFI System Partition Size (MiB)'
        required: true
        default: '4096'
      root_size_mib:
        description: 'Root Partition Size (MiB)'
        required: true
        default: '16384'

permissions:
  contents: write

jobs:
  build-workstation-release:
    name: Build Full Fedora Workstation Image (Fedora ${{ github.event.inputs.fedora_release || '45' }} + GNOME)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45
      options: --privileged --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Install Fedora build and virtualization tools
        run: |
          dnf install -y \
            git \
            make \
            rpm-build \
            rpmlint \
            qemu-img \
            edk2-ovmf \
            systemd-ukify \
            kernel-core \
            btrfs-progs \
            dosfstools \
            mtools \
            genisoimage \
            fdisk \
            dracut \
            gcc \
            cpio \
            gzip \
            xz \
            curl \
            gh \
            file
          git config --global --add safe.directory "*"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine incremental release version
        id: versioning
        run: |
          FEDORA_MAJOR="${{ github.event.inputs.fedora_release || '45' }}"
          USER_TAG="${{ github.event.inputs.release_version }}"

          if [ -n "${USER_TAG}" ]; then
            RELEASE_TAG="${USER_TAG}"
          else
            git fetch --tags --force 2>/dev/null || true
            LATEST_INC=$(git tag -l "${FEDORA_MAJOR}.*" "v${FEDORA_MAJOR}.*" | sed -E "s/^v?${FEDORA_MAJOR}\.([0-9]+).*/\1/" | sort -n | tail -n 1 || true)
            if [ -z "${LATEST_INC}" ]; then
              NEXT_INC=1
            else
              NEXT_INC=$((LATEST_INC + 1))
            fi
            RELEASE_TAG="${FEDORA_MAJOR}.${NEXT_INC}"
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "======================================================"
          echo " Target Release Version: ${RELEASE_TAG}"
          echo "======================================================"

      - name: Verify build environment
        run: |
          cat /etc/fedora-release
          dnf5 --version
          rpmbuild --version
          ukify --version
          qemu-img --version
          gh --version

      - name: Build GOFR RPMs
        run: |
          make rpms

      - name: Build Netinstall UEFI ISO (< 1 GiB)
        run: |
          export FEDORA_RELEASE="${{ github.event.inputs.fedora_release || '45' }}"
          export VERSION_TAG="${{ steps.versioning.outputs.tag }}"
          make iso
          mkdir -p out/release
          cp -v out/gofr-netinstall-*.iso out/release/

      - name: Build full Fedora Workstation release image
        run: |
          export FEDORA_RELEASE="${{ github.event.inputs.fedora_release || '45' }}"
          export VERSION_TAG="${{ steps.versioning.outputs.tag }}"
          export ESP_SIZE_MIB="${{ github.event.inputs.esp_size_mib || '4096' }}"
          export ROOT_SIZE_MIB="${{ github.event.inputs.root_size_mib || '16384' }}"
          ./scripts/release/build-workstation-image.sh

      - name: Archive release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gofr-workstation-release-${{ steps.versioning.outputs.tag }}
          path: |
            out/release/*.iso
            out/release/*.qcow2*
            out/release/SHA256SUMS
            out/release/manifest.json

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.versioning.outputs.tag }}
          FEDORA_MAJOR: ${{ github.event.inputs.fedora_release || '45' }}
        run: |
          echo "Publishing GitHub Release for GOFR ${RELEASE_TAG}..."

          cat << 'NOTES_EOF' > /tmp/release-notes.md
          # GOFR RELEASE_TAG_PLACEHOLDER — Glitchy's Opinionated Fedora Remix

          Official automated release build based on **Fedora Workstation FEDORA_MAJOR_PLACEHOLDER**.

          ## Netinstall Architecture (Recommended Delivery)
          - **Compact & Fast Download:** Download `gofr-netinstall-RELEASE_TAG_PLACEHOLDER-x86_64.iso` (< 1 GiB) in seconds.
          - **Always Up-to-Date:** Packages are streamed live from upstream mirrors during installation.
          - **Customizable Profiles:** Choose full Fedora Workstation GNOME, minimal desktop, or server/developer installations.
          - **Modern UKI + systemd-boot:** Automatically partitions a 4 GiB ESP at `/efi` and Btrfs root with subvolumes (`@` and `@home`).

          ### Quick Start: Write Netinstall ISO to USB
          ```bash
          sudo dd if=gofr-netinstall-RELEASE_TAG_PLACEHOLDER-x86_64.iso of=/dev/sdX bs=4M status=progress conv=fsync
          ```

          ## Pre-Installed Virtual Machine Disk Image (QCOW2)
          If downloading the pre-installed QCOW2 image, reassemble multipart chunks if applicable:
          ```bash
          cat gofr-workstation-RELEASE_TAG_PLACEHOLDER-x86_64.qcow2.part* > gofr-workstation-RELEASE_TAG_PLACEHOLDER-x86_64.qcow2
          sha256sum -c SHA256SUMS --ignore-missing
          ```

          Boot directly with UEFI:
          ```bash
          qemu-system-x86_64 -enable-kvm -m 4G -smp 4 \
            -bios /usr/share/edk2/ovmf/OVMF_CODE.fd \
            -drive file=gofr-workstation-RELEASE_TAG_PLACEHOLDER-x86_64.qcow2,format=qcow2
          ```

          ## Verification Checksums
          ```
          CHECKSUMS_PLACEHOLDER
          ```
          NOTES_EOF

          sed -i "s/RELEASE_TAG_PLACEHOLDER/${RELEASE_TAG}/g" /tmp/release-notes.md
          sed -i "s/FEDORA_MAJOR_PLACEHOLDER/${FEDORA_MAJOR}/g" /tmp/release-notes.md
          sed -i "/CHECKSUMS_PLACEHOLDER/r out/release/SHA256SUMS" /tmp/release-notes.md
          sed -i "s/CHECKSUMS_PLACEHOLDER//g" /tmp/release-notes.md

          # Select assets to upload (Netinstall ISO + QCOW2 chunks + checksums + manifest)
          UPLOAD_ASSETS=(out/release/*.iso out/release/SHA256SUMS out/release/manifest.json)
          if ls out/release/*.qcow2.part* 1> /dev/null 2>&1; then
              UPLOAD_ASSETS+=(out/release/*.qcow2.part*)
          elif ls out/release/*.qcow2 1> /dev/null 2>&1; then
              UPLOAD_ASSETS+=(out/release/*.qcow2)
          fi

          gh release create "${RELEASE_TAG}" \
            --title "GOFR ${RELEASE_TAG} (Fedora Workstation ${FEDORA_MAJOR})" \
            --notes-file /tmp/release-notes.md \
            "${UPLOAD_ASSETS[@]}"
