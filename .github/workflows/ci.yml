name: GOFR CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: ShellCheck validation
        run: |
          find scripts/ -type f -name "*.sh" -exec bash -n {} +

      - name: Spec file syntax verification
        run: |
          find packaging/ -type f -name "*.spec" -exec echo "Validating {}" \;

  build-rpms:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update && sudo apt-get install -y podman

      - name: Build GOFR RPMs
        run: |
          make rpms

      - name: Archive RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gofr-rpms
          path: out/rpms/*.rpm
